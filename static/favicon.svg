<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#3B2B55" rx="8"/>

  <!-- Sparkles -->
  <g fill="#FFFFFF" opacity="0.8">
    <path d="M 13 10 L 14.33 12.67 L 17 14 L 14.33 15.33 L 13 18 L 11.67 15.33 L 9 14 L 11.67 12.67 Z"/>
    <path d="M 54 13.2 L 54.93 15.07 L 56.8 16 L 54.93 16.93 L 54 18.8 L 53.07 16.93 L 51.2 16 L 53.07 15.07 Z"/>
    <path d="M 14 46.8 L 15.07 48.93 L 17.2 50 L 15.07 51.07 L 14 53.2 L 12.93 51.07 L 10.8 50 L 12.93 48.93 Z"/>
    <path d="M 48 42.2 L 48.93 44.07 L 50.8 45 L 48.93 45.93 L 48 47.8 L 47.07 45.93 L 45.2 45 L 47.07 44.07 Z"/>
  </g>

  <!-- banana drawn upright, then tilted: keeps the curve math readable -->
  <g transform="rotate(-30 32 32)">
    <!-- stem starts inside the body so the body covers its base -->
    <path d="M 46.5 30 L 54 21.5" stroke="#A87844" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- body is a thick round-capped stroke on a shallow circular arc. blunt
         ends and an even curve keep it off a crescent moon; radius well over
         half the chord keeps the ends from curling into a hook -->
    <path d="M 16 28 A 23 23 0 0 0 48 28"
          stroke="#FFD24A" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- blossom end -->
    <circle cx="12.5" cy="24.5" r="2" fill="#A87844"/>
  </g>

</svg>
