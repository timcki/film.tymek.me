<!doctype html>
<html lang="en" data-theme="%fn.theme%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="%fn.scheme%" />
		<!-- iOS tints the status bar with this, so it follows the chosen palette -->
		%fn.tint%
		<!-- the only thing the server cannot know: which way "auto" resolves. Run
		     before the first paint, so nobody sees the other palette on the way in -->
		<script>
			try {
				var root = document.documentElement;
				if (root.dataset.theme === 'auto')
					root.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches
						? 'light'
						: 'dark';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
