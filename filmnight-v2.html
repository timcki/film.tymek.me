<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Film Night</title>
<style>
  :root{
    --bg:#0f1012; --card:#16181c; --card2:#1b1e23; --line:#23262c; --line2:#2c3037;
    --ink:#eef0f3; --dim:#8b909a; --dimmer:#666b74;
    --mint:#6ee7a8; --mint-ink:#06301c; --warn:#e0a15f; --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{color:var(--ink);font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       padding-bottom:calc(72px + env(safe-area-inset-bottom));overflow-x:hidden}
  button{font:inherit}
  .wrap{max-width:620px;margin:0 auto;padding:0 14px}

  /* ---------- header ---------- */
  header{padding:24px 4px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:26px;letter-spacing:-.03em;font-weight:700}
  header .sub{font-size:12.5px;color:var(--dim);margin-top:4px}
  header .sub b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
  .pill{background:var(--card2);border:1px solid var(--line2);border-radius:99px;padding:7px 13px;
        font-size:12px;color:#b9bec7;white-space:nowrap}
  .pill b{color:var(--mint);font-variant-numeric:tabular-nums}
  .gear{background:none;border:0;color:var(--dimmer);font-size:17px;padding:4px 2px 4px 6px;cursor:pointer}
  .hr{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto}
  .hr .top{display:flex;align-items:center;gap:4px}
  .lang{display:flex;border:1px solid var(--line2);border-radius:99px;overflow:hidden;background:var(--card2)}
  .lang button{background:none;border:0;color:var(--dimmer);font-size:10.5px;font-weight:700;
               letter-spacing:.08em;padding:5px 9px;cursor:pointer}
  .lang button.on{background:var(--mint);color:var(--mint-ink)}

  /* ---------- film rows ---------- */
  .list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .film{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);
        border-radius:var(--r);padding:10px;transition:border-color .15s}
  .film.lead{border-color:var(--mint);background:linear-gradient(180deg,rgba(110,231,168,.055),var(--card));
             box-shadow:0 0 0 1px rgba(110,231,168,.16)}
  .film.fading{border-color:rgba(224,161,95,.34)}
  .film.shelf{opacity:.62}
  .p{width:72px;flex:0 0 72px;aspect-ratio:2/3;align-self:flex-start;border-radius:8px;overflow:hidden;background:#1a1d21;
     border:0;padding:0;cursor:pointer;position:relative;display:block}
  .p img{width:100%;height:100%;object-fit:cover;display:block}
  .p .ph{position:absolute;inset:0;display:grid;place-items:center;font:800 17px/1 ui-sans-serif,sans-serif;
         color:rgba(255,255,255,.45)}
  .b{flex:1;min-width:0;display:flex;flex-direction:column}
  .hd{display:flex;gap:10px;align-items:flex-start}
  .ttl{flex:1;min-width:0;font-size:15px;font-weight:650;letter-spacing:-.012em;line-height:1.25}
  .ttl .crown{display:inline-block;background:var(--mint);color:var(--mint-ink);font-size:8.5px;
              font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:2.5px 6px;
              border-radius:5px;vertical-align:2px;margin-left:6px}
  .sc{flex:0 0 auto;text-align:right;line-height:1}
  .sc b{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
  .film.lead .sc b{color:var(--mint)}
  .sc i{display:block;font-style:normal;font-size:8px;letter-spacing:.11em;text-transform:uppercase;
        color:var(--dimmer);font-weight:700;margin-top:3px}
  .meta{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.35}
  .meta2{font-size:11px;color:var(--dimmer);margin-top:2px;line-height:1.35}
  .meta .dot{color:var(--dimmer)}
  .backers{display:flex;flex-wrap:wrap;gap:5px;align-items:center;flex:1;min-width:0}
  .bk{display:flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);
      border-radius:99px;padding:2px 7px 2px 3px;font-size:10.5px;color:#c2c7cf}
  .bk .av{width:16px;height:16px;flex:0 0 16px;font-size:8px}
  .bk b{font-variant-numeric:tabular-nums;font-weight:700}
  .nobk{font-size:11px;color:var(--dimmer)}
  .note{font-size:11.5px;color:#b3b9c2;line-height:1.4;margin-top:7px;padding-left:8px;
        border-left:2px solid #37414a;font-style:italic;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .dnote{font-size:13.5px;color:#c5cad2;line-height:1.55;font-style:italic;margin:14px 0 0;
         padding:11px 13px;background:var(--card2);border-left:3px solid var(--mint);border-radius:0 10px 10px 0}
  .dnote .sig{display:block;font-style:normal;font-size:11.5px;color:var(--dimmer);margin-top:7px}
  .nedit{display:block;margin-top:9px;background:none;border:0;color:var(--mint);font-size:12px;
         font-weight:650;cursor:pointer;padding:0}
  .nin{width:100%;background:var(--card2);border:1px solid var(--line2);color:var(--ink);border-radius:10px;
       padding:10px 12px;font:inherit;font-size:13.5px;resize:none;margin-top:8px;line-height:1.45}
  .nin:focus{outline:none;border-color:#3f444d}
  .nlabel{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);
          font-weight:600;margin-top:16px}
  .cbtns{display:flex;gap:9px;margin-top:12px}
  .cbtns button{flex:1;border-radius:10px;padding:12px 0;font-size:14px;font-weight:650;cursor:pointer;
                border:1px solid var(--line2);background:var(--card2);color:var(--ink)}
  .cbtns button.go{flex:2;background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
  .crow{display:flex;gap:12px;align-items:center;margin-top:10px}
  .crow .th{width:48px;flex:0 0 48px;aspect-ratio:2/3;border-radius:7px;overflow:hidden;background:#1f2226}
  .crow .th img{width:100%;height:100%;object-fit:cover;display:block}
  .crow b{display:block;font-size:15px;font-weight:650}
  .crow span{display:block;font-size:12px;color:var(--dimmer)}
  .ft{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:9px}
  .ft .add{flex:1;min-width:0;font-size:11px;color:var(--dimmer)}
  .added{font-size:11px;color:var(--dimmer);margin-top:3px}
  .warnchip{color:var(--warn);font-size:10.5px;font-weight:650;white-space:nowrap}
  .av{width:19px;height:19px;border-radius:99px;display:grid;place-items:center;
      font:700 9px/1 ui-sans-serif,sans-serif;color:#0b0b0d;flex:0 0 19px}
  .tap{border:1px solid var(--line2);background:var(--card2);color:#c8cdd5;border-radius:9px;
       padding:6px 11px;font-size:11.5px;white-space:nowrap;font-weight:650;cursor:pointer;flex:0 0 auto}
  .tap.on{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
  .tap:disabled{opacity:.4;cursor:not-allowed}
  .addcard{border:1px dashed #2f333a;border-radius:var(--r);color:#767b84;font-size:13px;
           text-align:center;padding:15px;background:none;width:100%;cursor:pointer;margin-top:10px}
  .addcard b{color:#9aa0a9;font-weight:650}
  .empty{color:var(--dimmer);font-size:13px;text-align:center;padding:26px;
         border:1px dashed var(--line);border-radius:var(--r)}

  /* ---------- bottom nav ---------- */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(15,16,18,.93);
      backdrop-filter:blur(14px);border-top:1px solid var(--line);
      padding-bottom:env(safe-area-inset-bottom)}
  nav .inner{max-width:620px;margin:0 auto;display:flex}
  nav button{flex:1;background:none;border:0;color:var(--dimmer);font-size:10.5px;font-weight:600;
             letter-spacing:.04em;padding:11px 0 12px;cursor:pointer;display:flex;flex-direction:column;
             align-items:center;gap:4px}
  nav button .ic{line-height:0;display:block}
  nav button.on{color:var(--ink)}
  nav button.on .ic{color:var(--mint)}

  .tab{display:none}
  .tab.on{display:block}

  /* ---------- sheets ---------- */
  .scrim{position:fixed;inset:0;background:rgba(6,7,9,.72);backdrop-filter:blur(3px);z-index:60;
         opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--card);
         border-top:1px solid var(--line2);border-radius:20px 20px 0 0;
         max-height:92vh;overflow-y:auto;transform:translateY(102%);transition:transform .26s cubic-bezier(.22,.9,.3,1);
         padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .sheet.on{transform:translateY(0)}
  .sheet .inner{max-width:620px;margin:0 auto;padding:0 16px}
  .handle{display:block;width:44px;height:5px;border-radius:99px;background:#3a3f47;margin:11px auto 4px;
          border:0;padding:0;cursor:pointer}
  .handle:hover{background:#4b515b}
  .sheet .hzone{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer}

  .dhero{display:flex;gap:14px;padding:12px 0 4px}
  .dhero .p{width:96px;flex:0 0 96px;border-radius:10px;overflow:hidden;background:#1a1d21;aspect-ratio:2/3}
  .dhero .p img{width:100%;height:100%;object-fit:cover;display:block}
  .dhero h2{margin:0;font-size:20px;letter-spacing:-.02em;line-height:1.2}
  .dhero .yr{color:var(--dim);font-size:13px;margin-top:4px}
  .dhero .sc{margin-top:10px;font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .dhero .sc small{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
                   color:var(--dimmer);font-weight:700;margin-top:3px}
  .over{color:var(--dim);font-size:13px;line-height:1.55;margin:12px 0 0}
  .facts{margin:14px 0 0;border-top:1px solid var(--line);font-size:13px}
  .fact{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);
        color:var(--dim)}
  .fact b{color:var(--ink);font-weight:600;text-align:right}
  .spendbar{display:flex;align-items:center;gap:12px;margin:16px 0 4px;
            background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
  .spendbar .lab{flex:1;font-size:12.5px;color:var(--dim)}
  .spendbar .lab b{display:block;color:var(--ink);font-size:14px;font-weight:650}
  .step{display:flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
  .step button{width:40px;height:38px;background:var(--card);border:0;color:var(--ink);font-size:19px;
               font-weight:700;cursor:pointer;line-height:1}
  .step button:disabled{opacity:.25;cursor:not-allowed}
  .step span{width:40px;text-align:center;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
  .step span.on{color:var(--mint)}

  /* search sheet */
  .sinput{width:100%;background:var(--card2);border:1px solid var(--line2);color:var(--ink);
          border-radius:11px;padding:12px 14px;font:inherit;font-size:15px;margin:6px 0 4px}
  .sinput:focus{outline:none;border-color:#3f444d}
  .sres{margin-top:6px}
  .sres .r{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);
           cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit}
  .sres .r:disabled{opacity:.42;cursor:not-allowed}
  .sres .r .th{width:38px;flex:0 0 38px;aspect-ratio:2/3;border-radius:5px;overflow:hidden;background:#1f2226}
  .sres .r .th img{width:100%;height:100%;object-fit:cover;display:block}
  .sres .r .m{flex:1;min-width:0}
  .sres .r .m b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sres .r .m span{display:block;font-size:11.5px;color:var(--dimmer)}
  .hintline{color:var(--dimmer);font-size:12px;padding:10px 0 2px}

  /* ---------- watched / you ---------- */
  .wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
  .wcard{border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--line);position:relative}
  .wcard img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;filter:saturate(.55) brightness(.72)}
  .wcard .lb{position:absolute;left:0;right:0;bottom:0;padding:6px 7px;
             background:linear-gradient(180deg,transparent,rgba(8,9,11,.92));font-size:10px;color:#c3c8d0}
  .wcard .lb b{display:block;font-size:11px;font-weight:650;color:#fff;line-height:1.2;
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sec{margin:26px 0 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer);
       font-weight:600}
  .stat{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .stat span{color:var(--dim)}
  .stat b{font-variant-numeric:tabular-nums}
  .qrcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
          display:flex;gap:16px;align-items:center;margin-top:6px}
  .qrcard .q{background:#fff;padding:8px;border-radius:9px;line-height:0;flex:0 0 auto}
  .qrcard .q canvas{display:block;image-rendering:pixelated}
  .qrcard .tx{font-size:12.5px;color:var(--dim);min-width:0}
  .qrcard .tx b{color:var(--ink);display:block;font-size:14px;margin-bottom:4px}
  .danger{color:#e0715f;font-size:11.5px;margin-top:8px;line-height:1.45}
  .linkbox{font:11px/1.4 ui-monospace,Menlo,monospace;color:var(--dimmer);word-break:break-all;
           background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px}

  /* ---------- runoff takeover ---------- */
  .takeover{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;display:none;
            padding:0 0 40px}
  .takeover.on{display:block}
  .tk{max-width:560px;margin:0 auto;padding:26px 16px}
  .tk h2{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}
  .tk .lead{color:var(--dim);font-size:13.5px;margin:0 0 18px}
  .tkqr{background:#fff;padding:12px;border-radius:14px;display:inline-block;line-height:0}
  .tkqr canvas{display:block;image-rendering:pixelated}
  .code{font:800 30px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--mint);margin:14px 0 6px}
  .tkfilms{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 0}
  .tkfilm{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);
          text-align:center;padding-bottom:12px}
  .tkfilm img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
  .tkfilm .n{font-size:30px;font-weight:800;margin-top:10px;line-height:1;font-variant-numeric:tabular-nums}
  .tkfilm .l{font-size:11px;color:var(--dimmer);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
  .tkfilm.win{border-color:var(--mint)}
  .tkfilm.win .n{color:var(--mint)}
  .brow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brow .nm{flex:1;min-width:80px;font-size:13.5px;display:flex;align-items:center;gap:7px}
  .brow .nm i{width:8px;height:8px;border-radius:99px;display:inline-block;flex:0 0 8px}
  .brow.away .nm{color:var(--dimmer)}
  .fb{border:1px solid var(--line2);background:var(--card2);color:var(--dim);border-radius:8px;
      padding:6px 10px;font-size:11.5px;font-weight:650;cursor:pointer;max-width:145px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fb.on{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
  .bigbtn{width:100%;margin-top:18px;background:var(--mint);color:var(--mint-ink);border:0;border-radius:12px;
          padding:14px 0;font-size:15px;font-weight:700;cursor:pointer}

  /* ---------- dev panel ---------- */
  .dev{position:fixed;top:0;right:0;bottom:0;width:min(310px,86vw);z-index:95;background:#131418;
       border-left:1px solid var(--line2);transform:translateX(102%);transition:transform .24s;
       overflow-y:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .dev.on{transform:translateX(0)}
  .dev h3{margin:0 0 4px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer)}
  .dev p{font-size:11.5px;color:var(--dimmer);line-height:1.5;margin:0 0 16px}
  .dev label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);
             margin:14px 0 5px;font-weight:600}
  .dev select,.dev .db{width:100%;background:var(--card2);border:1px solid var(--line2);color:var(--ink);
                       border-radius:9px;padding:9px 11px;font-size:13.5px;cursor:pointer;text-align:left}
  .dev .db{margin-top:8px}
  .dev .db.pri{background:var(--mint);border-color:var(--mint);color:var(--mint-ink);font-weight:650}

  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
         background:#f0f2f6;color:#14151a;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;
         opacity:0;pointer-events:none;transition:.22s;z-index:100;box-shadow:0 10px 34px rgba(0,0,0,.45);
         max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- ============================ LIST ============================ -->
<div class="tab on" id="tab-list">
  <div class="wrap">
    <header>
      <div>
        <h1>Film Night</h1>
        <div class="sub" id="subline"></div>
      </div>
      <div class="hr">
        <div class="top">
          <div class="lang">
            <button data-lang="pl">PL</button><button data-lang="en">EN</button>
          </div>
          <button class="gear" id="gear" aria-label="prototype">⚙</button>
        </div>
        <span class="pill" id="budget"></span>
      </div>
    </header>
    <div class="list" id="grid"></div>
    <button class="addcard" id="addbtn"></button>
    <div id="shelvedwrap" style="display:none">
      <div class="sec" id="shelvedhead"></div>
      <div class="list" id="shelved"></div>
    </div>
  </div>
</div>

<!-- ========================== WATCHED =========================== -->
<div class="tab" id="tab-seen">
  <div class="wrap">
    <header><div><h1 data-i18n="watched_h"></h1><div class="sub" id="seensub"></div></div></header>
    <div class="wgrid" id="wgrid"></div>
    <div class="sec" data-i18n="fair_h"></div>
    <div id="fairness"></div>
<p style="color:var(--dimmer);font-size:12px;line-height:1.55;margin-top:14px" data-i18n="fair_note"></p>
  </div>
</div>

<!-- ============================ YOU ============================= -->
<div class="tab" id="tab-you">
  <div class="wrap">
    <header><div><h1 id="youname">You</h1><div class="sub" id="yousub"></div></div></header>
    <div class="sec" data-i18n="you_lang"></div>
    <div class="lang" style="display:inline-flex">
      <button data-lang="pl">POLSKI</button><button data-lang="en">ENGLISH</button>
    </div>
    <div class="sec" data-i18n="you_phone"></div>
    <div class="qrcard">
      <div class="q" id="deviceqr"></div>
      <div class="tx">
        <b data-i18n="qr_h"></b>
<span data-i18n="qr_b"></span><div class="danger" data-i18n="qr_warn"></div>
      </div>
    </div>
    <div class="linkbox" id="mylink"></div>
    <div class="sec" data-i18n="you_nums"></div>
    <div id="mystats"></div>
    <div class="sec" data-i18n="you_rules"></div>
    <div id="rulesbox" style="font-size:13.5px;color:var(--dim);line-height:1.6"></div>
  </div>
</div>

<nav><div class="inner">
  <button data-tab="list" class="on"><span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span><span data-i18n="tab_list"></span></button>
  <button data-tab="seen"><span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6.5 9.5 17 4 11.5"/></svg></span><span data-i18n="tab_seen"></span></button>

(function(){
var QR = (function(){
    var EXP=new Array(512), LOG=new Array(256), x=1, i;
    for(i=0;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&0x100) x^=0x11d; }
    for(i=255;i<512;i++) EXP[i]=EXP[i-255];
    function mul(a,b){ return (a===0||b===0)?0:EXP[LOG[a]+LOG[b]]; }
    function gen(n){
      var g=[1];
      for(var i=0;i<n;i++){
        var ng=[]; for(var k=0;k<=g.length;k++) ng[k]=0;
        for(var j=0;j<g.length;j++){ ng[j]^=g[j]; ng[j+1]^=mul(g[j],EXP[i]); }
        g=ng;
      }
      return g;
    }
    function ecc(data,n){
      var g=gen(n), r=data.slice(), j;
      for(j=0;j<n;j++) r.push(0);
      for(var i=0;i<data.length;i++){
        var c=r[i]; if(!c) continue;
        for(j=0;j<g.length;j++) r[i+j]^=mul(g[j],c);

    }
    // [total codewords, ecc per block, blocks] for ECC L
    var VER=[null,[26,7,1],[44,10,1],[70,15,1],[100,20,1],[134,26,1],
             [172,18,2],[196,20,2],[242,24,2],[292,30,2],[346,18,4]];
    var ALIGN=[null,[],[6,18],[6,22],[6,26],[6,30],[6,34],
               [6,22,38],[6,24,42],[6,26,46],[6,28,50]];

    function encode(text){
      var bytes=[], i;
      for(i=0;i<text.length;i++){
        var c=text.charCodeAt(i);
        if(c<128) bytes.push(c);

        else { bytes.push(224|(c>>12),128|((c>>6)&63),128|(c&63)); }
      }
      var ver=0;
      for(i=1;i<=10;i++){
        var cc = i<10?8:16;
        var cap = VER[i][0]-VER[i][1]*VER[i][2];
        if(Math.ceil((4+cc+8*bytes.length)/8) <= cap){ ver=i; break; }
      }
      if(!ver) throw new Error("too long for this encoder");
      var ccBits = ver<10?8:16;
      var totalData = VER[ver][0]-VER[ver][1]*VER[ver][2];

      var bits=[];
      function put(v,n){ for(var k=n-1;k>=0;k--) bits.push((v>>k)&1); }
      put(4,4); put(bytes.length,ccBits);
      for(i=0;i<bytes.length;i++) put(bytes[i],8);
      for(i=0;i<4 && bits.length<totalData*8;i++) bits.push(0);
      while(bits.length%8) bits.push(0);
      var dat=[];
      for(i=0;i<bits.length;i+=8){
        var b=0; for(var k=0;k<8;k++) b=(b<<1)|bits[i+k];
        dat.push(b);

      var pad=[0xEC,0x11], pi=0;
      while(dat.length<totalData) dat.push(pad[pi++%2]);

      // split into blocks (short blocks first), compute ecc, interleave
      var nb=VER[ver][2], ne=VER[ver][1];
      var shortLen=Math.floor(totalData/nb), nLong=totalData%nb, blocks=[], eblocks=[], off=0;
      for(i=0;i<nb;i++){
        var len=shortLen+(i>=nb-nLong?1:0);
        var blk=dat.slice(off,off+len); off+=len;
        blocks.push(blk); eblocks.push(ecc(blk,ne));
      }
      var out=[], maxLen=shortLen+(nLong?1:0);
      for(i=0;i<maxLen;i++) for(var b2=0;b2<nb;b2++) if(i<blocks[b2].length) out.push(blocks[b2][i]);
      for(i=0;i<ne;i++) for(b2=0;b2<nb;b2++) out.push(eblocks[b2][i]);

      /* ---- matrix ---- */
      var size=17+4*ver, M=[], R=[], r, c;
      for(r=0;r<size;r++){ M.push([]); R.push([]); for(c=0;c<size;c++){ M[r].push(0); R[r].push(0); } }
      function set(r,c,v){ if(r>=0&&r<size&&c>=0&&c<size){ M[r][c]=v; R[r][c]=1; } }
      function finder(fr,fc){
        for(var dr=-1;dr<=7;dr++) for(var dc=-1;dc<=7;dc++){
          var rr=fr+dr, cc=fc+dc;
          if(rr<0||rr>=size||cc<0||cc>=size) continue;
          var on = (dr>=0&&dr<=6&&(dc===0||dc===6)) || (dc>=0&&dc<=6&&(dr===0||dr===6)) ||
                   (dr>=2&&dr<=4&&dc>=2&&dc<=4);
          set(rr,cc,on?1:0);
        }
      }
      finder(0,0); finder(0,size-7); finder(size-7,0);
      for(i=8;i<size-8;i++){ set(6,i,i%2===0?1:0); set(i,6,i%2===0?1:0); }
      var al=ALIGN[ver];
      for(i=0;i<al.length;i++) for(var j=0;j<al.length;j++){

      if(ver>=7){

        for(i=17;i>=12;i--) if((vb>>i)&1) vb^=0x1f25<<(i-12);

        for(i=0;i<18;i++){

      for(i=0;i<out.length;i++) for(var k=7;k>=0;k--) data.push((out[i]>>k)&1);
      while(col>0){

        for(i=0;i<size;i++){
          var row = up? size-1-i : i;
          for(var s=0;s<2;s++){
            var cc2=col-s;
            if(!reserved[row][cc2]){ M[row][cc2] = bitIdx<data.length?data[bitIdx]:0; bitIdx++; }
          }

        col-=2; up=!up;
      }

      function maskFn(m,r,c){
        switch(m){
          case 0: return (r+c)%2===0;
          case 1: return r%2===0;
          case 2: return c%3===0;
          case 3: return (r+c)%3===0;
          case 4: return (Math.floor(r/2)+Math.floor(c/3))%2===0;
          case 5: return ((r*c)%2)+((r*c)%3)===0;
          case 6: return (((r*c)%2)+((r*c)%3))%2===0;

      function fmt(mask){
        var d=(1<<3)|mask, v=d<<10;
        for(var i=14;i>=10;i--) if((v>>i)&1) v^=0x537<<(i-10);
        return ((d<<10)|v)^0x5412;
      }
      function penalty(G){
        var p=0,r,c,i,run,dark=0;
        for(r=0;r<size;r++){ run=1; for(c=1;c<size;c++){ if(G[r][c]===G[r][c-1]){run++;} else {if(run>=5)p+=3+run-5;run=1;} } if(run>=5)p+=3+run-5; }
        for(c=0;c<size;c++){ run=1; for(r=1;r<size;r++){ if(G[r][c]===G[r-1][c]){run++;} else {if(run>=5)p+=3+run-5;run=1;} } if(run>=5)p+=3+run-5; }
        for(r=0;r<size-1;r++) for(c=0;c<size-1;c++)
          if(G[r][c]===G[r][c+1]&&G[r][c]===G[r+1][c]&&G[r][c]===G[r+1][c+1]) p+=3;
        var pat=[1,0,1,1,1,0,1,0,0,0,0];
        for(r=0;r<size;r++) for(c=0;c<=size-11;c++){
          var f=true,g=true;
          for(i=0;i<11;i++){ if(G[r][c+i]!==pat[i])f=false; if(G[c+i][r]!==pat[i])g=false; }
          if(f)p+=40; if(g)p+=40;
        }
        for(r=0;r<size;r++) for(c=0;c<size;c++) if(G[r][c]) dark++;
        p += Math.floor(Math.abs(dark*100/(size*size)-50)/5)*10;
        return p;
      }

      var best=null, bestP=Infinity;
      for(var mk=0;mk<8;mk++){
        var G=[]; for(r=0;r<size;r++){ G.push([]); for(c=0;c<size;c++) G[r].push(M[r][c]); }
        for(r=0;r<size;r++) for(c=0;c<size;c++) if(!reserved[r][c] && maskFn(mk,r,c)) G[r][c]^=1;
        var f=fmt(mk);
        // format info is written MSB-first, starting at (8,0) and at (size-1,8)
        for(i=0;i<6;i++)  G[8][i]=(f>>(14-i))&1;
        G[8][7]=(f>>8)&1; G[8][8]=(f>>7)&1; G[7][8]=(f>>6)&1;
        for(i=9;i<15;i++) G[14-i][8]=(f>>(14-i))&1;
        for(i=0;i<7;i++)  G[size-1-i][8]=(f>>(14-i))&1;
        for(i=7;i<15;i++) G[8][size-15+i]=(f>>(14-i))&1;
        G[size-8][8]=1;                                   // dark module
        var p=penalty(G);
        if(p<bestP){ bestP=p; best=G; }
      }
      return best;
    }
    return {encode:encode};
  })();

  function drawQR(node, text, scale){
    node.innerHTML="";

    try{ G=QR.encode(text); }catch(e){ node.textContent="QR failed"; return; }
    var n=G.length, s=scale||4, cv=document.createElement("canvas");

    var g=cv.getContext("2d");
    g.fillStyle="#fff"; g.fillRect(0,0,cv.width,cv.height);
    g.fillStyle="#000";
    for(var r=0;r<n;r++) for(var c=0;c<n;c++) if(G[r][c]) g.fillRect((c+q)*s,(r+q)*s,s,s);
    node.appendChild(cv);
  }

  function searchTMDB(q){
    var u = "https://api.themoviedb.org/3/search/movie?api_key="+TMDB_KEY+
            "&include_adult=false&query="+encodeURIComponent(q);
    var ctl = (typeof AbortController!=="undefined") ? new AbortController() : null;
    var timer = setTimeout(function(){ if(ctl) ctl.abort(); }, 3500);
    return fetch(u, ctl?{signal:ctl.signal}:undefined)
      .then(function(r){ clearTimeout(timer); if(!r.ok) throw 0; return r.json(); })
      .catch(function(e){ clearTimeout(timer); throw e; })
      .then(function(d){
      return (d.results||[]).filter(function(r){return r.title;}).slice(0,8).map(function(r){
        return {tmdb:r.id, title:r.title, year:parseInt((r.release_date||"").slice(0,4),10)||null,
                overview:(r.overview||"").slice(0,180),
                img:r.poster_path?IMG+"w342"+r.poster_path:null,
                thumb:r.poster_path?IMG+"w92"+r.poster_path:null};
      });
    });
  }
  function localSearch(q){
    q=q.toLowerCase();

      return f.title.toLowerCase().indexOf(q)>=0 || (f.director||"").toLowerCase().indexOf(q)>=0;
    }).slice(0,8).map(function(f){
      return {tmdb:f.tmdb,title:f.title,year:f.year,img:f.img,thumb:f.img,overview:f.overview,
              director:f.director,genre:f.genre,runtime:f.runtime};

  function renderRunoff(){

      '<button class="bigbtn" id="lockin">'+t(turnout?"ro_lock":"ro_nobody")+'</button>';

  function resolveRunoff(){
    var c=flashCounts();
    var win=RO.films.slice().sort(function(a,b){ return (c[b.id]||0)-(c[a.id]||0) || a.addedWeek-b.addedWeek; })[0];
    var n=c[win.id]||0;

    watch(win, n?t("t_room",win.title):t("t_seniority",win.title));
    nextWeek();
  }

  /* ============ the other five ============ */
  function hash(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
  function taste(pid,mv){
    var t=(hash(pid+"|"+mv.title)%1000)/1000;
    if(pid==="kuba") t = (mv.title==="Stalker" || myPts(mv,"kuba")>0) ? 1.6 : t*0.6;
    return t;
  }
  function botTurn(){
    var list=visible(); if(!list.length) return;
    PEOPLE.forEach(function(p){
      if(p.id===S.me || spent(p.id)>0) return;
      var ranked=list.slice().sort(function(a,b){ return taste(p.id,b)-taste(p.id,a); });
      if(M().banking){
        var fav=ranked[0];
        var lead=Math.max.apply(null, list.map(function(f){ return f===fav?0:score(f); }));
        var need=Math.ceil(lead-score(fav))+1;
        var sp=(need>0&&need<=S.bank[p.id])?need:(S.bank[p.id]>=M().cap?S.bank[p.id]:1);
        sp=Math.max(1,Math.min(sp,S.bank[p.id]));
        setPoints(p.id, fav.id, sp);
      } else if(M().perWeek>1){
        if(p.id==="kuba"){ setPoints(p.id, ranked[0].id, M().perWeek); return; }
        var top=ranked.slice(0,3), w=top.map(function(f){ return Math.pow(taste(p.id,f),3)+0.01; });
        var tot=w.reduce(function(a,b){return a+b;},0), rem=M().perWeek;
        top.forEach(function(f,i){
          var n=(i===top.length-1)?rem:Math.min(rem, Math.round(M().perWeek*w[i]/tot));
          if(n>0){ setPoints(p.id, f.id, n); rem-=n; }
        });
      } else setPoints(p.id, ranked[0].id, 1);
    });
  }
  function botNominations(){
    PEOPLE.forEach(function(p){
      if(p.id===S.me || nominated(p.id) || Math.random()<0.5) return;
      var pool=SEED.filter(function(f){
        return !S.movies.some(function(mv){return mv.title===f.title;}) &&
               !S.watched.some(function(h){return h.title===f.title;});
      });
      if(!pool.length) return;
      var f=pool[Math.floor(Math.random()*pool.length)];
      S.movies.push(mk(f.title, p.id, S.week, []));
    });
  }
  function watch(win, msg){
    S.watched.push({title:win.title, week:S.week, score:score(win), by:win.addedBy,
                    img:win.img, year:win.year, director:win.director});
    S.movies = S.movies.filter(function(mv){ return mv.id!==win.id; });
    toast(msg || t("t_watching", S.week, win.title));
  }
  function nextWeek(){
    var keep=[], gone=[];
    S.movies.forEach(function(mv){ (M().drop(mv)?gone:keep).push(mv); });
    if(gone.length){ S.movies=keep; S.dropped=gone.concat(S.dropped).slice(0,30); }
    if(M().banking) PEOPLE.forEach(function(p){
      S.bank[p.id]=Math.min(M().cap, S.bank[p.id]-spent(p.id)+M().perWeek);
    });
    S.week++; botNominations(); render();
  }
  function advance(){
    if(RO) return;
    botTurn();
    var order=visible(), top=order[0];
    if(!top || score(top)<=0){ toast(t("t_nothing")); nextWeek(); return; }
    var tied=order.filter(function(mv){ return score(mv)===score(top); });
    if(tied.length>1) return openRunoff(tied);
    watch(top); nextWeek();
  }

    if(tg.dataset.tab){
      S.tab=tg.dataset.tab;
      document.querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("on", x.id==="tab-"+S.tab); });
      document.querySelectorAll("nav button").forEach(function(b){ b.classList.toggle("on", b.dataset.tab===S.tab); });
      window.scrollTo(0,0); return;
    }
    if(tg.dataset.open){ openDetail(tg.dataset.open); return; }
    if(tg.dataset.quick){
      var mv=find(tg.dataset.quick), was=myPts(mv,S.me,S.week);
      if(M().perWeek===1 && !M().banking){
        var r=setPoints(S.me, mv.id, was?-1:1);
        toast(was?t("t_unvoted"):t("t_voted",mv.title));
      } else {
        var r2=setPoints(S.me, mv.id, 1);
        if(r2==="broke") toast(t(M().banking?"t_bank_empty":"t_no_points"));
        else if(r2==="revived") toast(t("t_revived",mv.title));
      }
      render(); return;
    }
    if(tg.dataset.renom){
      if(nominated(S.me)) return toast(t("t_already_nom"));
      var old=S.dropped.filter(function(x){return x.id===+tg.dataset.renom;})[0]; if(!old) return;
      S.dropped=S.dropped.filter(function(x){return x!==old;});
      var fresh=mk(old.title, S.me, S.week, []);
      if(!fresh.img){ fresh.img=old.img; fresh.director=old.director; fresh.genre=old.genre; }
      S.movies.push(fresh);
      toast(t("t_renom", old.title)); render(); return;
    }
    if(tg.dataset.step){
      var res=setPoints(S.me, tg.dataset.id, +tg.dataset.step);
      if(res==="broke") toast(t(M().banking?"t_bank_empty":"t_no_points"));
      render(); return;
    }
    if(tg.dataset.pick){
      var f=(el.sres.__res||[])[+tg.dataset.pick];
      if(f) confirmStep(f);
      return;
    }
    if(tg.dataset.nomback){ pending=null; el.q.style.display=""; showResults(el.sres.__res||[], el.q.value); return; }
    if(tg.dataset.nomgo){
      var n=document.getElementById("nomNote");
      if(pending) nominate(pending, n?n.value:"");
      pending=null; el.q.style.display="";
      return;
    }
    if(tg.dataset.noteedit){ noteEdit=true; openDetail(detailOpen, true);
      setTimeout(function(){ var x=document.getElementById("noteIn"); if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length);} },60);
      return; }
    if(tg.dataset.notecancel){ noteEdit=false; openDetail(detailOpen, true); return; }
    if(tg.dataset.notesave){
      var box=document.getElementById("noteIn"), mv2=find(tg.dataset.notesave);
      if(mv2 && box) mv2.note = box.value.trim();
      noteEdit=false; toast(t("t_note_saved")); render(); return;
    }
  });

  el.mode.addEventListener("change", function(){
    S=seed(el.mode.value); hideAll(); render();
    toast(t("t_switched", modeLabel()));
  });
  el.who.addEventListener("change", function(){ S.me=el.who.value; render(); });
  el.advance.addEventListener("click", function(){ hideAll(); advance(); });
  el.draw.addEventListener("click", function(){
    hideAll();
    var two=visible().slice(0,2);
    if(two.length<2) return toast(t("t_need_two"));
    openRunoff(two);
  });
  el.reset.addEventListener("click", function(){ S=seed(S.mode); hideAll(); render(); toast(t("t_reset")); });

  function clockText(){
    var now=new Date(), d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),20,0,0);
    d.setDate(d.getDate()+((4-d.getDay()+7)%7));
    if(d<=now) d.setDate(d.getDate()+7);
    var s=Math.floor((d-now)/1000);
    return t("clock", Math.floor(s/86400), Math.floor(s%86400/3600), Math.floor(s%3600/60), s%60);
  }
  function tick(){ if(el.clock) el.clock.textContent = clockText(); }

  document.addEventListener("click", function(e){
    var b=e.target.closest("[data-lang]"); if(!b || b.dataset.lang===LANG) return;
    LANG=b.dataset.lang; applyStatic(); render();
  });

  applyStatic(); render(); tick(); setInterval(tick,1000);

  /* ============ self-test ============ */
  window.__selftest=function(rounds, mode){
    if(mode){ S=seed(mode); render(); }
    var ok=true, log=[], draws=0, peak=0, start=S.week;
    for(var r=0;r<(rounds||30);r++){
      var before=S.week;
      botTurn();
      PEOPLE.forEach(function(p){
        if(spent(p.id)>budgetOf(p.id)){ ok=false; log.push("wk"+S.week+" "+p.name+" overspent"); }
        if(M().banking && (S.bank[p.id]<0 || S.bank[p.id]>M().cap)){ ok=false; log.push(p.name+" bank out of range"); }
        var n=S.movies.filter(function(mv){return mv.addedBy===p.id&&mv.addedWeek===S.week;}).length;
        if(n>1){ ok=false; log.push(p.name+" nominated "+n); }
      });
      peak=Math.max(peak, visible().length);
      advance();
      if(RO){
        draws++;
        PEOPLE.forEach(function(p){ if(Math.random()<0.35) return;
          RO.present[p.id]=String(RO.films[Math.floor(Math.random()*RO.films.length)].id); });
        var w0=S.watched.length; resolveRunoff();
        if(S.watched.length!==w0+1){ ok=false; log.push("runoff no winner"); }
      }
      if(S.week!==before+1){ ok=false; log.push("week stuck"); }
    }
    return {mode:S.mode, ok:ok, problems:log, weeks:S.week-start, visible:visible().length,
            dropped:S.dropped.length, peak:peak, watched:S.watched.length, draws:draws};
  };
})();

</script>
</body>
</html>
